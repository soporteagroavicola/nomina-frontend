<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nómina Agroavícola del Llano</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .tab-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tabs { border-bottom: 2px solid #ddd; display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e9ecef; cursor: pointer; border-radius: 5px 5px 0 0; font-weight: bold; transition: 0.2s; }
        .tab-btn:hover { background: #dde0e3; }
        .tab-btn.active { background: #007bff; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group-3cols { margin-bottom: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn-primary { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-danger { background: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-success { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .alert { padding: 10px; border-radius: 5px; margin: 10px 0; }
        .alert-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .alert-danger { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .header-title { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 28px; }
        .loading { color: #666; font-style: italic; margin: 10px 0; }
        .error-text { color: #dc3545; font-weight: bold; margin: 10px 0; }
        
        /* Estilo para la barra de búsqueda y filtro */
        .filters-container { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .filters-container input, .filters-container select { width: auto; min-width: 200px; padding: 8px; }
    </style>
</head>
<body>
    <h1 class="header-title">🏭 Nómina Agroavícola del Llano</h1>
    
    <div id="app" class="tab-container">
        <div class="tabs">
            <button class="tab-btn active" data-target="nomina">📊 Calcular Nómina</button>
            <button class="tab-btn" data-target="empleados">👤 Empleados</button>
            <button class="tab-btn" data-target="sucursales">🏢 Sucursales</button>
        </div>

        <div id="nomina" class="tab-content active">
            <h2>Calcular Nómina</h2>
            <div class="form-group">
                <div><label>Tipo:</label><select id="tipo"><option value="Quincenal">Quincenal</option><option value="Semanal">Semanal</option></select></div>
                <div><label>Fecha Inicio:</label><input type="date" id="fecha_inicio"></div>
                <div><label>Fecha Fin:</label><input type="date" id="fecha_fin"></div>
            </div>
            <div><label>Seleccionar empleados:</label><div id="lista_empleados" class="loading">Cargando empleados...</div></div>
            <br><button class="btn-primary" onclick="calcularNomina()">📊 Calcular Nómina</button>
            <div id="resultado_content"></div>
        </div>

        <div id="empleados" class="tab-content">
            <h2>Gestión de Empleados</h2>
            <div id="alert_emp"></div>
            <div style="border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 20px; background: #f9f9f9;">
                <h4>Agregar Nuevo Empleado</h4>
                <!-- Fila 1 -->
                <div class="form-group-3cols">
                    <input placeholder="Cédula" id="emp_cedula"><input placeholder="Nombres" id="emp_nombres">
                    <input placeholder="Apellidos" id="emp_apellidos"><input placeholder="Cargo" id="emp_cargo">
                    <input placeholder="Departamento" id="emp_depto"><input type="number" step="0.01" placeholder="Salario USD" id="emp_salario">
                </div>
                <!-- Fila 2 -->
                <div class="form-group-3cols">
                    <input type="date" placeholder="Fecha Nacimiento" id="emp_fecha_nacimiento">
                    <input type="date" placeholder="Fecha Ingreso" id="emp_fecha_ingreso">
                    <input placeholder="Cuenta Bancaria" id="emp_cuenta_bancaria">
                </div>
                <!-- Fila 3 (Nuevo campo agregado: Tipo Pago) -->
                <div class="form-group-3cols">
                    <select id="emp_sucursal">
                        <option value="">Seleccione una sucursal...</option>
                    </select>
                    <select id="emp_tipo_pago">
                        <option value="Quincenal">Pago Quincenal</option>
                        <option value="Semanal">Pago Semanal</option>
                    </select>
                    <button class="btn-success" onclick="crearEmpleado()">➕ Guardar Empleado</button>
                </div>
            </div>
            
            <!-- 🔽 NUEVOS FILTROS PARA LA TABLA -->
            <div class="filters-container">
                <input type="text" id="search_empleado" placeholder="🔍 Buscar por cédula o nombre..." oninput="cargarEmpleadosAdmin()">
                <select id="filter_sucursal" onchange="cargarEmpleadosAdmin()">
                    <option value="">Ver todas las sucursales</option>
                </select>
            </div>
            <!-- 🔽 FIN DE FILTROS -->

            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Cédula</th><th>Nombre</th><th>Cargo</th>
                        <th>Salario USD</th><th>Pago</th><th>Fec. Ingreso</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla_empleados"></tbody>
            </table>
        </div>

        <div id="sucursales" class="tab-content">
            <h2>Gestión de Sucursales</h2>
            <div id="alert_suc"></div>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input id="suc_nombre" placeholder="Nombre de la nueva sucursal" style="width: 300px;">
                <button class="btn-success" onclick="crearSucursal()">➕ Agregar Sucursal</button>
            </div>
            <table><thead><tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr></thead><tbody id="tabla_sucursales"></tbody></table>
        </div>
    </div>

    <script>
        const API_URL = 'https://nomina-backend-kc2j.onrender.com';

        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-target');
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                    document.getElementById(tabId).classList.add('active');
                    this.classList.add('active');

                    if (tabId === 'empleados') cargarEmpleadosAdmin();
                    else if (tabId === 'sucursales') cargarSucursales();
                    else if (tabId === 'nomina') cargarEmpleados();
                });
            });
            cargarEmpleados();
        });

        // --- CALCULAR NÓMINA ---
        async function cargarEmpleados() {
            try {
                const res = await fetch(`${API_URL}/api/empleados`);
                if(!res.ok) throw new Error("Error al obtener empleados");
                const empleados = await res.json();
                const container = document.getElementById('lista_empleados');
                if(empleados.length === 0) {
                    container.innerHTML = "<p style='color: #888;'>No hay empleados registrados. Ve a la pestaña 'Empleados' para crear uno.</p>";
                } else {
                    container.innerHTML = empleados.map(e => 
                        `<label><input type="checkbox" value="${e.id_empleado}" checked> ${e.cedula} - ${e.nombres} ${e.apellidos}</label><br>`
                    ).join('');
                }
            } catch (e) { console.error(e); }
        }

        async function calcularNomina() {
            const tipo = document.getElementById('tipo').value;
            const fecha_inicio = document.getElementById('fecha_inicio').value;
            const fecha_fin = document.getElementById('fecha_fin').value;
            const ids = Array.from(document.querySelectorAll('#lista_empleados input:checked')).map(c => parseInt(c.value));
            if(!ids.length) return alert('Selecciona al menos un empleado');
            
            try {
                const res = await fetch(`${API_URL}/api/calcular_nomina`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({tipo, fecha_inicio, fecha_fin, empleados_ids: ids, faltas: {}, horas_extras: {}})
                });
                const data = await res.json();
                if(data.error) return alert('Error: '+data.error);
                let html = `<h3>Tasa BCV: Bs. ${data.tasa_bcv.toFixed(2)}</h3><table><tr><th>Empleado</th><th>Base</th><th>Asign.</th><th>Deducc.</th><th>Neto USD</th><th>Neto Bs</th></tr>`;
                data.resultados.forEach(r => html += `<tr><td>${r.empleado.nombre_completo}</td><td>$${r.salario_base_usd.toFixed(2)}</td><td>$${r.total_asignaciones_usd.toFixed(2)}</td><td>$${r.total_deducciones_usd.toFixed(2)}</td><td><b>$${r.neto_pagar_usd.toFixed(2)}</b></td><td><b>Bs. ${r.neto_pagar_bs.toFixed(2)}</b></td></tr>`);
                html += `</table>`;
                document.getElementById('resultado_content').innerHTML = html;
            } catch(e) { 
                alert('Error al calcular la nómina.');
            }
        }

        // --- GESTIÓN EMPLEADOS ---
        async function cargarEmpleadosAdmin() {
            const tableBody = document.getElementById('tabla_empleados');
            tableBody.innerHTML = '<tr><td colspan="8" class="loading">Cargando empleados...</td></tr>';
            try {
                // 🔽 Leer los valores de los filtros y pasarlos a la URL
                const searchText = document.getElementById('search_empleado').value;
                const filterSucursal = document.getElementById('filter_sucursal').value;
                
                let url = `${API_URL}/api/empleados`;
                const params = [];
                if (searchText) params.push(`search=${encodeURIComponent(searchText)}`);
                if (filterSucursal) params.push(`sucursal_id=${encodeURIComponent(filterSucursal)}`);
                if (params.length > 0) url += '?' + params.join('&');
                // 🔽 Fin de la preparación de URL

                const res = await fetch(url);
                if(!res.ok) throw new Error(`Error HTTP ${res.status}`);
                const empleados = await res.json();
                
                if(empleados.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888;">No se encontraron empleados con esos filtros.</td></tr>';
                } else {
                    tableBody.innerHTML = empleados.map(e => 
                        `<tr>
                            <td>${e.id_empleado}</td><td>${e.cedula}</td>
                            <td>${e.nombres} ${e.apellidos}</td><td>${e.cargo}</td>
                            <td>$${e.salario_mensual_usd}</td>
                            <td>${e.tipo_pago}</td>
                            <td>${e.fecha_ingreso || '-'}</td>
                            <td><button class="btn-danger" onclick="eliminarEmpleado(${e.id_empleado})">🗑️ Eliminar</button></td>
                        </tr>`
                    ).join('');
                }
                
                // Cargar opciones para el select de Sucursales (tanto para el formulario como para el filtro)
                const resSuc = await fetch(`${API_URL}/api/sucursales`);
                if(resSuc.ok) {
                    const sucs = await resSuc.json();
                    
                    // Select del formulario de agregar
                    const selectSucForm = document.getElementById('emp_sucursal');
                    selectSucForm.innerHTML = '<option value="">Seleccione una sucursal...</option>' + 
                        sucs.map(s => `<option value="${s.id_sucursal}">${s.nombre}</option>`).join('');
                    
                    // Select del filtro (Asegurarnos de mantener la opción "Todas" al recargar)
                    const selectSucFilter = document.getElementById('filter_sucursal');
                    const currentFilterValue = selectSucFilter.value; // Guardamos el valor seleccionado
                    selectSucFilter.innerHTML = '<option value="">Ver todas las sucursales</option>' + 
                        sucs.map(s => `<option value="${s.id_sucursal}">${s.nombre}</option>`).join('');
                    selectSucFilter.value = currentFilterValue; // Reasignamos el valor para que no se pierda al actualizar
                }
            } catch(e) { 
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red; font-weight:bold;">Error al cargar empleados: ${e.message}</td></tr>`;
                console.error(e); 
            }
        }

        async function crearEmpleado() {
            const data = {
                cedula: document.getElementById('emp_cedula').value,
                nombres: document.getElementById('emp_nombres').value,
                apellidos: document.getElementById('emp_apellidos').value,
                cargo: document.getElementById('emp_cargo').value,
                departamento: document.getElementById('emp_depto').value,
                salario_mensual_usd: parseFloat(document.getElementById('emp_salario').value) || 0,
                sucursal_id: parseInt(document.getElementById('emp_sucursal').value) || null,
                fecha_nacimiento: document.getElementById('emp_fecha_nacimiento').value || null,
                fecha_ingreso: document.getElementById('emp_fecha_ingreso').value || null,
                cuenta_bancaria: document.getElementById('emp_cuenta_bancaria').value || '',
                tipo_pago: document.getElementById('emp_tipo_pago').value
            };
            try {
                const res = await fetch(`${API_URL}/api/empleados`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
                let resp;
                try { resp = await res.json(); } catch { resp = { error: "El servidor respondió con HTML en lugar de JSON" }; }
                
                const alertBox = document.getElementById('alert_emp');
                if(res.ok) { alertBox.innerHTML = `<div class="alert alert-success">${resp.mensaje}</div>`; cargarEmpleadosAdmin(); }
                else { alertBox.innerHTML = `<div class="alert alert-danger">Error: ${resp.error}</div>`; }
            } catch (error) {
                document.getElementById('alert_emp').innerHTML = `<div class="alert alert-danger">Error de red: ${error.message}</div>`;
            }
        }

        async function eliminarEmpleado(id) {
            if(!confirm('¿Seguro que quieres eliminar este empleado?')) return;
            try {
                const res = await fetch(`${API_URL}/api/empleados/${id}`, { method: 'DELETE' });
                const resp = await res.json();
                if(res.ok) { cargarEmpleadosAdmin(); } else { alert('Error: '+resp.error); }
            } catch (e) { alert("Error de red al eliminar."); }
        }

        // --- GESTIÓN SUCURSALES ---
        async function cargarSucursales() {
            const tableBody = document.getElementById('tabla_sucursales');
            tableBody.innerHTML = '<tr><td colspan="3" class="loading">Cargando sucursales...</td></tr>';
            try {
                const res = await fetch(`${API_URL}/api/sucursales`);
                if(!res.ok) throw new Error(`Error del servidor: Estado ${res.status}`);
                
                let data;
                const contentType = res.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    data = await res.json();
                } else {
                    const text = await res.text();
                    throw new Error(`El servidor devolvió HTML. Revisa los logs de Render. Fragmento: ${text.substring(0, 80)}...`);
                }

                if(data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">No hay sucursales creadas. Crea una arriba.</td></tr>';
                } else {
                    tableBody.innerHTML = data.map(s => 
                        `<tr><td>${s.id_sucursal}</td><td>${s.nombre}</td><td><button class="btn-danger" onclick="eliminarSucursal(${s.id_sucursal})">🗑️ Eliminar</button></td></tr>`
                    ).join('');
                }
            } catch(e) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red; font-weight:bold;">❌ Error: ${e.message}</td></tr>`;
                console.error(e);
            }
        }

        async function crearSucursal() {
            const nombre = document.getElementById('suc_nombre').value;
            if(!nombre) return alert("El nombre de la sucursal no puede estar vacío.");
            try {
                const res = await fetch(`${API_URL}/api/sucursales`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({nombre}) });
                
                let resp;
                try { resp = await res.json(); } catch { resp = { error: "El servidor no respondió con JSON" }; }

                const alertBox = document.getElementById('alert_suc');
                if(res.ok) { 
                    alertBox.innerHTML = `<div class="alert alert-success">${resp.mensaje}</div>`; 
                    document.getElementById('suc_nombre').value = ''; 
                    cargarSucursales(); 
                } else { 
                    alertBox.innerHTML = `<div class="alert alert-danger">⚠️ Error del servidor: ${resp.error || 'Error desconocido'}</div>`; 
                }
            } catch (error) {
                document.getElementById('alert_suc').innerHTML = `<div class="alert alert-danger">❌ Error de red: ${error.message}</div>`;
            }
        }

        async function eliminarSucursal(id) {
            if(!confirm('¿Seguro que quieres eliminar esta sucursal? Si tiene empleados, elimínalos primero.')) return;
            try {
                const res = await fetch(`${API_URL}/api/sucursales/${id}`, { method: 'DELETE' });
                const resp = await res.json();
                if(res.ok) { cargarSucursales(); } else { alert('Error: '+resp.error); }
            } catch (e) { alert("Error de red al eliminar."); }
        }
    </script>
</body>
</html>
