<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nómina Pro | Agroavícola del Llano</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #1a2a6c;
            --primary-light: #2d4373;
            --accent: #2563eb;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            --radius: 12px;
        }
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        /* Layout */
        .app-container { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar { background: var(--primary); color: white; padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar-logo { font-size: 20px; font-weight: 700; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; font-size: 14px; font-weight: 500; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: rgba(255,255,255,0.15); box-shadow: 0 0 0 1px rgba(255,255,255,0.2); }
        .main-content { padding: 32px; max-width: 1400px; }
        
        /* Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .user-chip { display: flex; align-items: center; gap: 12px; background: var(--bg-card); padding: 8px 16px; border-radius: 100px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        
        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .kpi-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform 0.2s; }
        .kpi-card:hover { transform: translateY(-2px); }
        .kpi-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 8px; }
        .kpi-value { font-size: 32px; font-weight: 700; color: var(--primary); }
        .kpi-delta { font-size: 13px; margin-top: 4px; font-weight: 500; }
        .kpi-delta.positive { color: var(--success); }
        
        /* Cards */
        .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 16px; font-weight: 600; }
        .card-body { padding: 24px; }
        
        /* Forms */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; background: var(--bg-card); color: var(--text-main); transition: all 0.2s; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        
        /* Tables */
        .table-wrap { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .table th { text-align: left; padding: 14px 16px; background: var(--bg-body); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
        .table td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .table tr:hover td { background: rgba(0,0,0,0.02); }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 600; }
        .badge-quincenal { background: #dbeafe; color: #1e40af; }
        .badge-semanal { background: #fef3c7; color: #92400e; }
        
        /* Tabs */
        .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 24px; overflow-x: auto; }
        .tab { padding: 12px 20px; border: none; background: none; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        /* Loading & Empty */
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, #e2e8f0 50%, var(--border) 75%); background-size: 200% 100%; animation: skeleton 1.5s infinite; border-radius: 6px; height: 20px; }
        @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        
        /* Toast */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: var(--bg-card); border-left: 4px solid var(--success); padding: 16px 20px; border-radius: 8px; box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; min-width: 300px; }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .main-content { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">🏭 Nómina Pro</div>
            <nav id="sidebar-nav">
                <div class="nav-item active" data-page="dashboard"><span>📊</span> Dashboard</div>
                <div class="nav-item" data-page="nomina"><span>🧮</span> Nómina</div>
                <div class="nav-item" data-page="empleados"><span>👤</span> Empleados</div>
                <div class="nav-item" data-page="cestaticket"><span>🍽️</span> Cestaticket</div>
                <div class="nav-item" data-page="historial"><span>📋</span> Historial</div>
                <div class="nav-item" data-page="reportes"><span>📈</span> Reportes</div>
                <div class="nav-item" data-page="parametros"><span>⚙️</span> Parámetros</div>
                <div class="nav-item" data-page="seguridad"><span>🔐</span> Usuarios</div>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title" id="page-title">Dashboard</h1>
                <div class="user-chip">
                    <span id="user-name">Cargando...</span>
                    <button class="btn btn-ghost" onclick="App.toggleTheme()">🌓</button>
                    <button class="btn btn-danger" onclick="App.logout()">Salir</button>
                </div>
            </div>
            
            <div id="content-area">
                <!-- Dynamic content loads here -->
            </div>
        </main>
    </div>
    
    <div class="toast-container" id="toasts"></div>

    <script>
        // ============================================================
        // APP CORE - Arquitectura Profesional
        // ============================================================
        const API_URL = 'https://nomina-backend-kc2j.onrender.com'; // Cambia esto
        
        class Store {
            constructor() {
                this.state = {
                    user: null,
                    empleados: [],
                    sucursales: [],
                    parametros: {},
                    lotes: [],
                    loading: false
                };
                this.listeners = [];
            }
            subscribe(fn) { this.listeners.push(fn); }
            setState(newState) {
                this.state = { ...this.state, ...newState };
                this.listeners.forEach(fn => fn(this.state));
            }
            getState() { return this.state; }
        }
        
        const store = new Store();
        
        class ApiClient {
            static async request(url, options = {}) {
                options.credentials = 'include';
                options.headers = { 'Content-Type': 'application/json', ...options.headers };
                try {
                    const res = await fetch(`${API_URL}${url}`, options);
                    if (res.status === 401) {
                        window.location.href = 'login.html';
                        return null;
                    }
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
                    return data;
                } catch (e) {
                    App.toast(e.message, 'error');
                    throw e;
                }
            }
            static get(url) { return this.request(url); }
            static post(url, body) { return this.request(url, { method: 'POST', body: JSON.stringify(body) }); }
            static put(url, body) { return this.request(url, { method: 'PUT', body: JSON.stringify(body) }); }
            static delete(url) { return this.request(url, { method: 'DELETE' }); }
        }
        
        class App {
            static async init() {
                try {
                    const auth = await ApiClient.get('/api/check_auth');
                    if (!auth.authenticated) {
                        window.location.href = 'login.html';
                        return;
                    }
                    store.setState({ user: auth });
                    document.getElementById('user-name').textContent = `👤 ${auth.username} (${auth.rol})`;
                    this.setupNavigation();
                    this.loadPage('dashboard');
                } catch (e) {
                    console.error(e);
                }
            }
            
            static setupNavigation() {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                        item.classList.add('active');
                        this.loadPage(item.dataset.page);
                    });
                });
            }
            
            static async loadPage(page) {
                const titles = {
                    dashboard: 'Dashboard', nomina: 'Nómina', empleados: 'Empleados',
                    cestaticket: 'Cestaticket', historial: 'Historial', reportes: 'Reportes',
                    parametros: 'Parámetros', seguridad: 'Usuarios'
                };
                document.getElementById('page-title').textContent = titles[page];
                const container = document.getElementById('content-area');
                container.innerHTML = '<div class="skeleton" style="height:400px;"></div>';
                
                try {
                    switch(page) {
                        case 'dashboard': await Pages.dashboard(container); break;
                        case 'nomina': await Pages.nomina(container); break;
                        case 'empleados': await Pages.empleados(container); break;
                        case 'cestaticket': await Pages.cestaticket(container); break;
                        case 'historial': await Pages.historial(container); break;
                        case 'reportes': await Pages.reportes(container); break;
                        case 'parametros': await Pages.parametros(container); break;
                        case 'seguridad': await Pages.seguridad(container); break;
                    }
                } catch (e) {
                    container.innerHTML = `<div class="empty-state">❌ Error cargando página: ${e.message}</div>`;
                }
            }
            
            static toast(message, type = 'success') {
                const container = document.getElementById('toasts');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<strong>${type === 'error' ? 'Error' : 'Éxito'}</strong><br>${message}`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }
            
            static toggleTheme() {
                const html = document.documentElement;
                html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            }
            
            static async logout() {
                await ApiClient.post('/api/logout');
                window.location.href = 'login.html';
            }
        }
        
        // ============================================================
        // PAGES
        // ============================================================
        class Pages {
            static async dashboard(container) {
                const stats = await ApiClient.get('/api/dashboard');
                container.innerHTML = `
                    <div class="dashboard-grid">
                        <div class="kpi-card">
                            <div class="kpi-label">Total Empleados</div>
                            <div class="kpi-value">${stats.empleados.total}</div>
                            <div class="kpi-delta positive">↑ ${stats.empleados.quincenal} Quincenal / ${stats.empleados.semanal} Semanal</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Pagos Mes Actual</div>
                            <div class="kpi-value">$${stats.pagos_mes_actual.usd.toLocaleString()}</div>
                            <div class="kpi-delta">Bs. ${stats.pagos_mes_actual.bs.toLocaleString()}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Cestaticket Mes</div>
                            <div class="kpi-value">Bs. ${stats.cestaticket_mes_actual.toLocaleString()}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Última Nómina</div>
                            <div class="kpi-value">#${stats.ultima_nomina?.id_lote || '-'}</div>
                            <div class="kpi-delta">${stats.ultima_nomina?.descripcion || 'Sin datos'}</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">🏢 Distribución por Sucursal</div></div>
                        <div class="card-body">
                            <div class="table-wrap">
                                <table class="table">
                                    <thead><tr><th>Sucursal</th><th>Empleados</th></tr></thead>
                                    <tbody>${stats.sucursales.map(s => `<tr><td>${s.nombre}</td><td>${s.total}</td></tr>`).join('')}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            static async nomina(container) {
                const [sucursales, empleados] = await Promise.all([
                    ApiClient.get('/api/sucursales'),
                    ApiClient.get('/api/empleados?limit=500')
                ]);
                
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><div class="card-title">🧮 Nueva Nómina</div></div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label">Tipo de Pago</label>
                                    <select class="form-select" id="nom-tipo" onchange="NominaPage.autoPeriod()">
                                        <option value="Quincenal">Quincenal</option>
                                        <option value="Semanal">Semanal</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Período</label>
                                    <div style="display:flex;gap:8px;align-items:center;">
                                        <input type="date" class="form-input" id="nom-inicio">
                                        <span>→</span>
                                        <input type="date" class="form-input" id="nom-fin">
                                        <button class="btn btn-ghost" onclick="NominaPage.autoPeriod()">⏳ Auto</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Descripción</label>
                                    <input type="text" class="form-input" id="nom-desc" placeholder="Ej: 1ra Quincena Agosto 2026">
                                </div>
                            </div>
                            <div style="margin-top:16px;">
                                <label class="form-label">Filtrar Empleados</label>
                                <div class="form-grid">
                                    <select class="form-select" id="nom-sucursal" onchange="NominaPage.filterEmpleados()">
                                        <option value="">Todas las sucursales</option>
                                        ${sucursales.map(s => `<option value="${s.id_sucursal}">${s.nombre}</option>`).join('')}
                                    </select>
                                    <select class="form-select" id="nom-tipo-emp" onchange="NominaPage.filterEmpleados()">
                                        <option value="">Todos</option><option value="Quincenal">Quincenal</option><option value="Semanal">Semanal</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">👥 Empleados Seleccionados</div>
                            <div>
                                <button class="btn btn-ghost" onclick="NominaPage.selectAll()">✅ Todos</button>
                                <button class="btn btn-ghost" onclick="NominaPage.deselectAll()">❌ Ninguno</button>
                            </div>
                        </div>
                        <div class="card-body" id="nom-empleados-list">
                            <div class="empty-state">Cargando empleados...</div>
                        </div>
                    </div>
                    
                    <div style="display:flex;gap:12px;margin-top:16px;">
                        <button class="btn btn-primary" onclick="NominaPage.calcular(true)">💾 Guardar Nómina</button>
                        <button class="btn btn-success" onclick="NominaPage.calcular(true, true)">📦 Guardar + TXT 60/40</button>
                        <button class="btn btn-ghost" onclick="NominaPage.calcular(false)">👁️ Vista Previa</button>
                    </div>
                    <div id="nom-resultado" style="margin-top:24px;"></div>
                `;
                
                NominaPage.empleados = empleados.data;
                NominaPage.renderEmpleados();
                NominaPage.autoPeriod();
            }
            
            static async empleados(container) {
                const data = await ApiClient.get('/api/empleados?limit=100');
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><div class="card-title">👤 Gestión de Empleados</div></div>
                        <div class="card-body">
                            <div class="table-wrap">
                                <table class="table">
                                    <thead>
                                        <tr><th>Cédula</th><th>Nombre</th><th>Cargo</th><th>Salario</th><th>Pago</th><th>Acciones</th></tr>
                                    </thead>
                                    <tbody>
                                        ${data.data.map(e => `
                                            <tr>
                                                <td>${e.cedula}</td>
                                                <td><strong>${e.nombres} ${e.apellidos}</strong></td>
                                                <td>${e.cargo || '-'}</td>
                                                <td>$${e.salario_mensual_usd}</td>
                                                <td><span class="badge badge-${e.tipo_pago.toLowerCase()}">${e.tipo_pago}</span></td>
                                                <td><button class="btn btn-ghost" style="padding:4px 12px;font-size:12px;">✏️</button></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            static async cestaticket(container) {
                container.innerHTML = `<div class="card"><div class="card-body">Módulo de Cestaticket - Implementación similar a nómina</div></div>`;
            }
            
            static async historial(container) {
                const lotes = await ApiClient.get('/api/lotes');
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><div class="card-title">📋 Historial de Nóminas</div></div>
                        <div class="card-body">
                            <div class="table-wrap">
                                <table class="table">
                                    <thead><tr><th>ID</th><th>Descripción</th><th>Fecha</th><th>Empleados</th><th>Total USD</th><th>Total Bs</th></tr></thead>
                                    <tbody>
                                        ${lotes.map(l => `
                                            <tr>
                                                <td><strong>#${l.id_lote}</strong></td>
                                                <td>${l.descripcion || '-'}</td>
                                                <td>${l.fecha_calculo}</td>
                                                <td>${l.cantidad_empleados_lote}</td>
                                                <td>$${parseFloat(l.total_usd).toFixed(2)}</td>
                                                <td>Bs. ${parseFloat(l.total_bs).toFixed(2)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            static async reportes(container) {
                container.innerHTML = `<div class="card"><div class="card-body">Módulo de Reportes - En desarrollo</div></div>`;
            }
            
            static async parametros(container) {
                const params = await ApiClient.get('/api/parametros');
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><div class="card-title">⚙️ Parámetros del Sistema</div></div>
                        <div class="card-body">
                            <div class="form-grid">
                                ${Object.entries(params).map(([k, v]) => `
                                    <div class="form-group">
                                        <label class="form-label">${v.descripcion || k}</label>
                                        <input type="text" class="form-input" id="param-${k}" value="${v.valor}">
                                    </div>
                                `).join('')}
                            </div>
                            <div style="margin-top:20px;display:flex;gap:12px;">
                                <button class="btn btn-primary" onclick="ParametrosPage.guardar()">💾 Guardar</button>
                                <button class="btn btn-ghost" onclick="ParametrosPage.actualizarBCV()">🔄 Actualizar BCV</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            static async seguridad(container) {
                container.innerHTML = `<div class="card"><div class="card-body">Módulo de Usuarios - En desarrollo</div></div>`;
            }
        }
        
        // ============================================================
        // NÓMINA PAGE LOGIC
        // ============================================================
        class NominaPage {
            static empleados = [];
            static seleccionados = new Set();
            
            static autoPeriod() {
                const tipo = document.getElementById('nom-tipo').value;
                const hoy = new Date();
                let inicio, fin;
                
                if (tipo === 'Quincenal') {
                    if (hoy.getDate() <= 15) {
                        inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
                        fin = new Date(hoy.getFullYear(), hoy.getMonth(), 15);
                    } else {
                        inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 16);
                        fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
                    }
                } else {
                    const dia = hoy.getDay();
                    const diff = hoy.getDate() - dia + (dia === 0 ? -6 : 1);
                    inicio = new Date(hoy.setDate(diff));
                    fin = new Date(hoy.setDate(inicio.getDate() + 6));
                }
                
                const fmt = d => d.toISOString().split('T')[0];
                document.getElementById('nom-inicio').value = fmt(inicio);
                document.getElementById('nom-fin').value = fmt(fin);
                
                if (!document.getElementById('nom-desc').value) {
                    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
                    document.getElementById('nom-desc').value = `${tipo} ${inicio.getDate()}-${fin.getDate()} ${meses[fin.getMonth()]} ${fin.getFullYear()}`;
                }
            }
            
            static filterEmpleados() {
                const suc = document.getElementById('nom-sucursal').value;
                const tipo = document.getElementById('nom-tipo-emp').value;
                const filtrados = this.empleados.filter(e => {
                    return (!suc || e.sucursal_id == suc) && (!tipo || e.tipo_pago === tipo);
                });
                this.renderEmpleados(filtrados);
            }
            
            static renderEmpleados(lista = this.empleados) {
                const container = document.getElementById('nom-empleados-list');
                if (!lista.length) {
                    container.innerHTML = '<div class="empty-state">No hay empleados con estos filtros</div>';
                    return;
                }
                
                const grupos = {};
                lista.forEach(e => {
                    const key = e.sucursal_nombre || 'Sin Sucursal';
                    if (!grupos[key]) grupos[key] = [];
                    grupos[key].push(e);
                });
                
                let html = '';
                for (const [suc, emps] of Object.entries(grupos)) {
                    html += `<div style="margin-bottom:16px;"><div style="font-weight:700;color:var(--primary);margin-bottom:8px;">🏢 ${suc}</div>`;
                    html += emps.map(e => `
                        <div style="display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;transition:background 0.2s;" onmouseover="this.style.background='var(--bg-body)'" onmouseout="this.style.background='transparent'">
                            <input type="checkbox" class="emp-check" value="${e.id_empleado}" checked onchange="NominaPage.toggleEmp(${e.id_empleado})">
                            <span><strong>${e.cedula}</strong> - ${e.nombres} ${e.apellidos}</span>
                            <span class="badge badge-${e.tipo_pago.toLowerCase()}" style="margin-left:auto;">${e.tipo_pago}</span>
                        </div>
                    `).join('');
                    html += '</div>';
                }
                container.innerHTML = html;
                this.seleccionados = new Set(lista.map(e => e.id_empleado));
            }
            
            static toggleEmp(id) {
                if (this.seleccionados.has(id)) this.seleccionados.delete(id);
                else this.seleccionados.add(id);
            }
            
            static selectAll() {
                document.querySelectorAll('.emp-check').forEach(c => { c.checked = true; this.seleccionados.add(parseInt(c.value)); });
            }
            
            static deselectAll() {
                document.querySelectorAll('.emp-check').forEach(c => { c.checked = false; this.seleccionados.delete(parseInt(c.value)); });
            }
            
            static async calcular(guardar, txt = false) {
                const tipo = document.getElementById('nom-tipo').value;
                const inicio = document.getElementById('nom-inicio').value;
                const fin = document.getElementById('nom-fin').value;
                const desc = document.getElementById('nom-desc').value;
                
                if (!this.seleccionados.size) {
                    App.toast('Selecciona al menos un empleado', 'error');
                    return;
                }
                
                const detalles = {};
                // Aquí iría la lógica de recolección de faltas/horas/bonos por empleado
                
                try {
                    const res = await ApiClient.post('/api/calcular_nomina', {
                        tipo, fecha_inicio: inicio, fecha_fin: fin, descripcion: desc,
                        empleados_ids: Array.from(this.seleccionados),
                        guardar_en_bd: guardar,
                        aplicar_deducciones: true
                    });
                    
                    let html = `<div class="card"><div class="card-header"><div class="card-title">📊 Resultado</div></div><div class="card-body">`;
                    html += `<div class="table-wrap"><table class="table"><thead><tr><th>Empleado</th><th>Base</th><th>Deducciones</th><th>Neto USD</th><th>Neto Bs</th></tr></thead><tbody>`;
                    html += res.resultados.map(r => `
                        <tr><td><strong>${r.nombre_completo}</strong></td><td>$${r.salario_base_usd.toFixed(2)}</td><td>$${r.total_deducciones_usd.toFixed(2)}</td><td><strong>$${r.neto_pagar_usd.toFixed(2)}</strong></td><td><strong>Bs. ${r.neto_pagar_bs.toFixed(2)}</strong></td></tr>
                    `).join('');
                    html += `</tbody></table></div></div></div>`;
                    
                    document.getElementById('nom-resultado').innerHTML = html;
                    App.toast(guardar ? `Nómina guardada como Lote #${res.lote_id}` : 'Vista previa generada');
                    
                    if (txt && res.lote_id) {
                        setTimeout(() => window.open(`${API_URL}/api/generar_archivo_pago/${res.lote_id}?tipo=60`), 500);
                        setTimeout(() => window.open(`${API_URL}/api/generar_archivo_pago/${res.lote_id}?tipo=40`), 1500);
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        }
        
        class ParametrosPage {
            static async guardar() {
                const inputs = document.querySelectorAll('[id^=\"param-\"]');
                for (const inp of inputs) {
                    const clave = inp.id.replace('param-', '');
                    await ApiClient.put('/api/parametros', { clave, valor: inp.value });
                }
                App.toast('Parámetros guardados');
            }
            static async actualizarBCV() {
                const res = await ApiClient.get('/api/actualizar_bcv');
                App.toast(`Tasa BCV actualizada: Bs. ${res.tasa}`);
            }
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
